<div class="hold-transition register-page bg">
    <div class="container-fluid w-50 p-3">
      
        <div class="card border border-primary">

          <div class="card-body register-card-body">
            <h6 class="display-6 text-center">Thrift</h6>
            <p class="lead text-center">Register as a new member</p>
      
            <form  #regForm='ngForm' (ngSubmit)='RegisterCustomer(regForm)'>

              <div class="form-floating mb-3">
                <input type="text" class="form-control" id="Name" name="Name" [(ngModel)]="model.Name" placeholder="Full name" required>
                <label for="floatingInput">Full Name</label>
              </div>

              <div class="form-floating mb-3">
                <input type="email" class="form-control" id="Email" name="Email" [(ngModel)]="model.Email" placeholder="Email" required>
                <label for="floatingInput">Email</label>
              </div>

              <div class="form-floating mb-3">
                <input type="text" class="form-control" name="Phone" id="Phone" [(ngModel)]="model.Phone" placeholder="Phone Number" maxlength="10" oninput="this.value=this.value.replace(/[^0-9]/g,'');" required>
                <label for="floatingInput">Phone Number</label>
              </div>
              
              <div class="form-floating mb-3">
                <input type="password" id="Password" name="Password" [(ngModel)]="model.Password" class="form-control" placeholder="Password" required>
                <label for="floatingInput">Password</label>
              </div>
              <div class="form-floating mb-3">
                <input type="password" id="ConfirmPassword" name="ConfirmPassword" [(ngModel)]="model.ConfirmPassword" class="form-control" placeholder="Retype password" required>
                <label for="floatingInput">Re-type Password</label>
              </div>
              <div class="row">
                
                <div class="col-4">
                  <button type="submit" [disabled]=!regForm.form.valid  class="btn btn-primary btn" style="width: 15rem;">Register</button>
                </div>
              </div>
            </form>
            <!--{{model | json}}-->
      
            
      
            <a [routerLink]="['/login']" class="text-center" style="text-decoration: none; cursor:pointer;">Already have an Account: Sign In</a><br/>
            <a [routerLink]="['/']" class="text-center" style="text-decoration: none; cursor:pointer;">Back to Thrfit</a>
          </div>
          <!-- /.form-box -->
        </div><!-- /.card -->
      </div>
    </div>
