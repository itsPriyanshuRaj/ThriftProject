<div class="jumbotron jumbotron-fluid jumbo">
	<div class="text-center">
		<h1 class="display-5">Product List</h1>
	</div>
</div>
<div class="container-fluid">
	<div class="row justify-content-center" style="margin-top: -200px; z-index: 1px;">
		<div class="col">
			<div class="card shadow" style="border: none;">
				<div class="card-header">
					<!-- <p class="card-title lead">All Products</p> -->

					<div>
						<table id="example" class="table table-hover">
							<tbody>
								<tr>
									<th class="lead">Product</th>
									<th class="lead">Name</th>
									<th class="lead">Price</th>
									<th class="lead">Category</th>
									<th class="lead">Delete</th>
									
								</tr>
								
								<tr *ngFor="let model of models | paginate:{itemsPerPage:6,currentPage:p};">
									<td><img src="http://localhost:3000/{{model.PRODUCT_IMAGE}}"
											height="60px"></td>
									<td>{{model.PRODUCT_NAME}}</td>
									<td>{{model.PRICE}}</td>
									<td>{{model.CATEGORY}}</td>
									<td><button class="btn btn-danger"
											(click)="Delete(model.PRODUCT_ID)">Delete</button></td>
								</tr>

							</tbody>
						</table>
					</div>
					<pagination-controls (pageChange)="p=$event"></pagination-controls>
					<button type="button" class="btn btn-warning" [routerLink]="['/adminDash']">Back to
						Dashboard</button>
				</div>
			</div>
		</div>
	</div>
</div>
