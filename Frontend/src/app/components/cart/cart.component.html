<div class="container m-5 text-center bg">
    <h3 class="display-5 text-center">Shopping Cart</h3>


    <div class="card text-center">
        <table class="table">
            <thead>
                <tr>
                    <th scope="col" class="lead">Image</th>
                    <th scope="col" class="lead">Name</th>
                    <th scope="col" class="lead">Price</th>
                    <th scope="col" class="lead">Delivery Charges</th>
                    <th scope="col" class="lead">Delete </th>
                </tr>
            </thead>
            <tbody>
    
                <tr *ngFor="let stores of stored">
                    <!-- Product Image starts here -->
                    <td>
                        <div class="d-flex me-4">
                            <img class="shadow-lg rounded" src="http://localhost:3000/{{stores[0].image}}" height="150px" alt="">
                        </div>
                    </td>
                    <!-- Product Image ends here -->
                    <!-- Product Name starts -->
                    <td>
                        <div class="media-body">
                            <h5 class="">{{stores[0].company}}&nbsp;{{stores[0].name}}&nbsp;{{stores[0].colour}}&nbsp;{{stores[0].variant}}
                            </h5>
                        </div>
                    </td>
                    <!-- Product Image ends -->
                    <!-- Product Price starts-->
                    <td>
                        <h5>{{stores[0].price | currency: "&#8377;"}}</h5>
                    </td>
                    <!-- Product Price Ends -->
                    <!-- Product Delivery Charges starts-->
                    <td>
                        <h5 *ngIf="stores[0].price > 499 "><del>{{500 | currency: "&#8377;" }} </del><span
                                style="color: green">&nbsp; *Free</span></h5>
    
    
                        <h5 *ngIf="stores[0].price <= 499 ">{{500 | currency: "&#8377;" }}<span style="color:green">&nbsp;
                                *only</span></h5>
                    </td>
                    <!-- Product Delivery Charges ends -->
    
                    <!-- Product Total Price starts-->
                    <td>
                        <button class="delete-icon" (click)="Delete($event,stores[0].name)"></button>
                        <!-- <b><i class="fas fa-trash" style="cursor: pointer;" (click)="Delete($event,stores[0].name)">Del</i></b> -->
                    </td>
                    <!-- Product Total Price ends -->
                </tr>
                <!-- buttons -->
                <td>
                    <!-- <span>Subtotal:</span> -->
                    <h5 class="lead float-end">Subtotal :{{total | currency: "&#8377;"}}</h5>
                </td>
            </tbody>
        </table>
        <div class="btn-group">
            <button class="btn button-28" (click)="DeleteAll($event)">Clear Cart</button>
            <button class="btn button-28 " [routerLink]="['/shop']">Continue Shopping</button>
            <button class="btn button-28" [routerLink]="['/checkout']" [disabled]="(stored==null)">Proceed to
                checkout</button>
        </div>
    </div>
    
</div>
