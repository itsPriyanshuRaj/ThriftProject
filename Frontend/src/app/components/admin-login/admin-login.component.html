<div class="container d-flex border border-secondary rounded mt-5 mb-4">
  <div class="flex-shrink-0">
    <img src="https://images.unsplash.com/photo-1611078489935-0cb964de46d6?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=774&q=80" alt="...">
  </div>
  <div class="flex-grow-1 ms-3">
    <h3 class="display-5 text-center mt-2">Welcome to the Admin Access</h3>
    <p class="lead text-center">Enter your PIN access.</p>
    <div class="form-floating mt-5">
      <input type="password" id="password" name="password" [(ngModel)]="model.password" #password="ngModel"
        class="form-control" placeholder="password">
      <label for="floatingInput">Password</label>
      <div class="btn-group">
        <button type="submit" class="btn btn-dark mt-4" style="width: 15rem;"(click)="Login($event)">Login</button>
        <button type="button" class="btn button-6 mt-4 ms-3" style="width: 15rem;" routerLinkActive="active" routerLink="">Home</button>
      </div>
    </div>
  </div>
</div>
